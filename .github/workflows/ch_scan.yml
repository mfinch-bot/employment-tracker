name: ch-scan
on:
  push:
    branches: [main]
    paths: ["tools/ch_scan.py"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q pypdf pdfplumber
      - run: python3 tools/ch_scan.py
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ch_scan.json
          git commit -m "Levantamento dos relatorios"
          git pull --rebase origin main
          git push
