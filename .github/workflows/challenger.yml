name: challenger
# Publica so o Challenger; o payroll ignora mudancas em scripts/challenger*
on:
  schedule:
    # 7:05 ET no horario de verao (11h UTC) e no de inverno (12h UTC)
    - cron: "5 11 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "20 12 * * 1-5"
    # Rodadas de seguranca
    - cron: "45 13 * * 1-5"
    - cron: "45 16 * * 1-5"
  push:
    branches: [main]
    paths: ["scripts/challenger*", ".github/workflows/challenger.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: challenger
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q pypdf
      - id: run
        name: Consulta a Challenger e monta a pagina
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # O agendamento do GitHub nao esta disparando: um commit "Armar ..." deixa o robo esperando a hora oficial
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${COMMIT_MSG#Armar}" != "$COMMIT_MSG" ]; then
            python3 scripts/challenger.py --watch
          else
            python3 scripts/challenger.py --once --force
            python3 scripts/adp.py --once --force
            python3 scripts/jolts.py
          fi
      - name: Junta com o que saiu enquanto o robo esperava
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "Challenger $(python3 -c "import json;print(json.load(open('docs/state_challenger.json'))['as_of'])")" || true
          git pull --rebase origin main
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.changed == 'true'
        with:
          path: docs
      - id: deploy
        if: steps.run.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Guarda os dados
        if: steps.run.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push
      - name: Se a publicacao falhou, tenta de novo com outro commit
        if: steps.run.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          gh workflow run challenger.yml --ref main
