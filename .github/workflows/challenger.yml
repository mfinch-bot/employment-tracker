name: challenger
on:
  push:
    branches: [main]
    paths: ["scripts/challenger*", ".github/workflows/challenger.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: challenger
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q pypdf
      - run: python3 scripts/challenger_probe.py
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Teste Challenger" || exit 0
          git pull --rebase origin main
          git push
