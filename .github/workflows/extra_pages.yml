name: extra-pages
on:
  schedule:
    # Quinta: 8:25 ET no horario de verao (12h UTC) e no de inverno (13h UTC)
    - cron: "25 12 * * 4"
    - cron: "25 13 * * 4"
    # Demais dados, longe do horario dos releases
    - cron: "5 17 * * 1-5"
    - cron: "5 21 * * 1-5"
  push:
    branches: [main]
    paths: ["scripts/extra_pages*", ".github/workflows/extra_pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: extra-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q pypdf openpyxl pdfplumber
      - id: run
        name: Consulta as fontes e monta as paginas
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/extra_pages.py --watch
          else
            python3 scripts/extra_pages.py --force
            python3 scripts/revelio.py --once --force
            python3 scripts/challenger.py --once --force
            python3 scripts/adp.py --once --force
            python3 scripts/jolts.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Junta com o que saiu enquanto o robo esperava
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "Paginas extras $(date -u +%Y-%m-%d)" || true
          git pull --rebase origin main
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.changed == 'true'
        with:
          path: docs
      - id: deploy
        if: steps.run.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Guarda os dados
        if: steps.run.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push
      - name: Se a publicacao falhou, tenta de novo com outro commit
        if: steps.run.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          gh workflow run extra_pages.yml --ref main
