name: h1
on:
  push:
    branches: [main]
    paths: ["tools/h1.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/h1.py
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/h1.json
          git commit -m "Series longas"
          git pull --rebase origin main
          git push
