name: jolts-pagina
on:
  push:
    branches: [main]
    paths: ["scripts/jolts*", ".github/workflows/jolts.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Monta a pagina do JOLTS
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 scripts/jolts.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Guarda os dados
        run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "JOLTS" || exit 0
          git pull --rebase origin main
          git push
      - name: Se a publicacao falhou, tenta de novo com outro commit
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          gh workflow run jolts.yml --ref main
