name: release
on:
  schedule:
    # 8:10 e 8:20 ET no horario de verao (12h UTC) e no de inverno (13h UTC)
    - cron: "10 12 * * 1-5"
    - cron: "20 12 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "20 13 * * 1-5"
    # Rodadas de seguranca
    - cron: "40 14 * * 1-5"
    - cron: "40 17 * * 1-5"
  push:
    branches: [main]
    paths: ["scripts/**", "!scripts/jolts*", "!scripts/adp*", "!scripts/challenger*", "!scripts/revelio*", "!scripts/extra_pages*", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: run
        name: Consulta o BLS e monta o dashboard
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Um commit "Armar ..." deixa o robo esperando a hora oficial, sem depender do agendamento
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${COMMIT_MSG#Armar}" != "$COMMIT_MSG" ]; then
            python3 scripts/update.py --watch
          else
            python3 scripts/update.py --once --force
          fi
      - name: Publica
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        if: steps.run.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Guarda os dados
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "Release $(python3 -c "import json;print(json.load(open('data/state.json'))['as_of'])")" || exit 0
          git pull --rebase origin main
          git push
      - name: Se a publicacao falhou, tenta de novo com outro commit
        if: steps.run.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          gh workflow run release.yml --ref main
