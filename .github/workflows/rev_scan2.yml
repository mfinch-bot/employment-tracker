name: rev-scan2
on:
  push:
    branches: [main]
    paths: ["tools/rev_scan2.py"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/rev_scan2.py
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rev_scan2
          git commit -m "Levantamento Revelio out/26"
          git pull --rebase origin main
          git push
