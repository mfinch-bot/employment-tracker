name: src2
on:
  push:
    branches: [main]
    paths: ["tools/src2.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q openpyxl
      - run: python3 tools/src2.py
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/atl.json
          git commit -m "Teste Atlanta"
          git pull --rebase origin main
          git push
