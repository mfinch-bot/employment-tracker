name: teste-bls
on:
  push:
    branches: [main]
    paths: [.github/workflows/teste.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_bls.py
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - run: |
          git config user.name "employment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw.json
          git commit -m "Atualiza dados do BLS" || exit 0
          git push
