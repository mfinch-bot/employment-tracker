      if(lab.has(i)&&v!=null)return{value:v,label:labelOf(s,lab.get(i),dark,s.data.length,ch)};
      return v});
    const col='#'+(s.color||'A6A6A6');
    if(s.noline&&s.marker&&s.marker[0]==='dash'&&s.type==='line'){
      return{name:s.name,type:'scatter',data:data,symbol:'rect',symbolSize:[Math.max(10,560/(n||12)*.55),4],itemStyle:{color:'#'+(s.markerColor||s.color)},yAxisIndex:s.yAxis,z:5}}
    if(s.type==='bar'){
      return{name:s.name,type:'bar',stack:s.stack||undefined,data:data,itemStyle:{color:col},barCategoryGap:ch.horizontal?'45%':'65%',barGap:'0%',
        label:s.show?{show:true,position:'outside',fontSize:11,color:'#153D64',formatter:p=>p.value==null?'':fmtNum(p.value,s.fmt||ch.axes[0].fmt)}:undefined,labelLayout:{hideOverlap:false}}}
    if(s.type==='area'){
      return{name:s.name,type:'line',stack:'band',data:data,symbol:'none',lineStyle:{width:0},areaStyle:s.fill?{color:'#'+s.fill,opacity:.8}:{opacity:0},z:1}}
    const mark=s.marker&&s.marker[0]!=='none'||(!s.marker&&ch.cats&&ch.cats.length===12);
    return{name:s.name,type:'line',data:data,yAxisIndex:s.yAxis,connectNulls:true,clip:true,
      symbol:'circle',symbolSize:mark?7:1,showSymbol:true,showAllSymbol:true,
      lineStyle:{color:col,width:s.width||2.25,type:DASH[s.dash]||'solid'},itemStyle:{color:col},z:s.labels.length?4:3}
  });
  return{animation:false,grid:{left:ch.horizontal?205:44,right:ch.axes.length>1?52:44,top:18,bottom:legend.length?(ch.date?(n>30?76:72):(n===11?92:n>12?64:52)):(ch.date?(n>30?54:48):(n>12?44:30)),containLabel:false},
    legend:legend.length?{data:legend,bottom:0,itemWidth:22,itemHeight:8,icon:undefined,textStyle:{color:'#153D64',fontSize:11}}:undefined,
    tooltip:{trigger:'axis',valueFormatter:v=>v==null?'':(Math.abs(v)<1&&ch.axes[0].fmt&&ch.axes[0].fmt.includes('%')?(v*100).toFixed(2)+'%':(Math.abs(v)<100?Number(v).toFixed(2):Math.round(v)))},
    xAxis:ch.horizontal?{...axes[0],position:'top'}:cat,yAxis:ch.horizontal?cat:axes,series}
}
const grid=document.getElementById('grid'),insts=[];
function actions(img,data,cls,imgLabel){
  const w=document.createElement('div');w.className='act'+(cls?' '+cls:'');
  const mk=(txt,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;
    b.onclick=async()=>{let msg='Copiado';try{msg=await fn()||msg}catch(e){msg='Não copiou'}
      b.textContent=msg;b.classList.add('ok');setTimeout(()=>{b.textContent=txt;b.classList.remove('ok')},1500)};return b};
  w.append(mk(imgLabel||'Copiar gráfico',img),mk('Copiar dados',data));return w}
async function copyCanvas(cv,name){
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);return'Copiado'}
  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(name||'grafico').replace(/[^\w-]+/g,'_')+'.png';a.click();return'Baixado'}}
function chartImage(c,inst){
  return new Promise((res,rej)=>{const im=new Image();im.onload=async()=>{
    const scale=2,head=(c.title[1]?54:32)*scale,cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height+head;
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.textAlign='center';x.fillStyle='#153D64';
    x.font='700 '+16*scale+'px Aptos,Calibri,Arial,sans-serif';x.fillText(c.title[0]||'',cv.width/2,22*scale);
    if(c.title[1]){x.font='700 '+12*scale+'px Aptos,Calibri,Arial,sans-serif';x.fillText(c.title[1],cv.width/2,42*scale)}
    x.drawImage(im,0,head);try{res(await copyCanvas(cv,c.title[0]))}catch(e){rej(e)}};im.onerror=rej;
    im.src=inst.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#fff'})})}
function cellText(v,f){if(v==null)return'';if(typeof v!=='number')return String(v);
  return f&&f.includes('%')?(v*100).toFixed(2)+'%':v.toFixed(2)}
function chartData(c){
  if(c.scatter){const rows=[['Group','Month','Unemployment rate','Vacancy rate']];
    c.series.forEach(s=>s.points.forEach(p=>rows.push([s.name,p[2],(p[0]*100).toFixed(2)+'%',(p[1]*100).toFixed(2)+'%'])));
    return navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n'))}
  const sers=c.series.filter(s=>!['Band','Percentile 0.25 - 70s'].includes(s.name));
  const head=[''].concat(sers.map(s=>s.name||c.title[0]));
  const rows=(c.cats||[]).map((m,i)=>[m].concat(sers.map(s=>{const v=s.data[i];return cellText(v,ch_fmt(c,s))})));
  return navigator.clipboard.writeText([head].concat(rows).map(r=>r.join('\t')).join('\n'))}
function ch_fmt(c,s){return c.axes[s.yAxis||0].fmt}
function tableRows(tb){return[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].flatMap(td=>{const n=+td.getAttribute('colspan')||1;return[td.innerText.replace(/\s+/g,' ').trim(),...Array(n-1).fill('')]}))}
async function tableImage(tb,title){
  const r=tb.getBoundingClientRect(),s=2,top=0,cv=document.createElement('canvas');cv.width=r.width*s;cv.height=r.height*s;
  const x=cv.getContext('2d');x.scale(s,s);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.textBaseline='middle';
  tb.querySelectorAll('th,td').forEach(td=>{const b=td.getBoundingClientRect(),st=getComputedStyle(td),X=b.left-r.left,Y=b.top-r.top;
    if(st.backgroundColor!=='rgba(0, 0, 0, 0)'&&st.backgroundColor!=='transparent'){x.fillStyle=st.backgroundColor;x.fillRect(X,Y,b.width,b.height)}
    x.fillStyle=st.color;x.font=st.fontStyle+' '+st.fontWeight+' '+st.fontSize+' '+st.fontFamily;x.textAlign=st.textAlign==='left'?'left':'center';
    const txt=td.innerText.replace(/\s+/g,' ').trim();
    const room=b.width-6,wid=x.measureText(txt).width;
    if(wid>room)x.font=st.fontStyle+' '+st.fontWeight+' '+(parseFloat(st.fontSize)*room/wid)+'px '+st.fontFamily;
    x.fillText(txt,st.textAlign==='left'?X+parseFloat(st.paddingLeft):X+b.width/2,Y+b.height/2)});
  return copyCanvas(cv,title)}
document.querySelectorAll('.tw').forEach(w=>{const tb=w.querySelector('table');
  w.parentNode.insertBefore(actions(()=>tableImage(tb,w.dataset.title),()=>navigator.clipboard.writeText(tableRows(tb).map(r=>r.join('\t')).join('\n')),'tb','Copiar tabela'),w)});
const rows={};CH.forEach(c=>{(rows[c.row]=rows[c.row]||[]).push(c)});
CH.forEach((c,idx)=>{
  if(c.section){const t=document.createElement('h3');t.className='sec';t.textContent=c.section;grid.appendChild(t)}
  const d=document.createElement('section');d.className='c'+(rows[c.row].length<2?' full':'')+(c.tall?' tall':'');
  const h=document.createElement('h2');h.textContent=c.title[0]||'';d.appendChild(h);
  if(c.title[1]){const p=document.createElement('p');p.className='sub';p.textContent=c.title[1];d.appendChild(p)}
  const e=document.createElement('div');e.className='chart';
  d.appendChild(actions(()=>chartImage(c,insts[idx]),()=>chartData(c)));
  d.appendChild(e);grid.appendChild(d);
  c._full=rows[c.row].length<2;
  const i=echarts.init(e,null,{renderer:'canvas'});i.setOption(build(c));insts.push(i)});
addEventListener('resize',()=>insts.forEach(i=>i.resize()));
const ASOF='2026-10';
async function poll(){try{
  const st=await fetch('state_adp.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  if(st.as_of!==ASOF){location.replace(location.pathname+'?v='+st.as_of);return}
  const nx=st.next_release?new Date(st.next_release).getTime():null;
  document.getElementById('wait').hidden=!(nx&&Date.now()>nx);
}catch(e){}}
poll();setInterval(poll,20000);
</script></body></html>
