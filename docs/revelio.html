    c.series.forEach(s=>s.points.forEach(p=>rows.push([s.name,p[2],(p[0]*100).toFixed(2)+'%',(p[1]*100).toFixed(2)+'%'])));

  const sers=c.series.filter(s=>!['Band','Percentile 0.25 - 70s'].includes(s.name));
  const head=[''].concat(sers.map(s=>s.name||c.title[0]));
  const rows=(c.cats||[]).map((m,i)=>[m].concat(sers.map(s=>{const v=s.data[i];return cellText(v,ch_fmt(c,s))})));
  return navigator.clipboard.writeText([head].concat(rows).map(r=>r.join('\t')).join('\n'))}
function ch_fmt(c,s){return c.axes[s.yAxis||0].fmt}
function tableRows(tb){return[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].flatMap(td=>{const n=+td.getAttribute('colspan')||1;return[td.innerText.replace(/\s+/g,' ').trim(),...Array(n-1).fill('')]}))}
async function tableImage(tb,title){
  const r=tb.getBoundingClientRect(),s=2,top=0,cv=document.createElement('canvas');cv.width=r.width*s;cv.height=r.height*s;
  const x=cv.getContext('2d');x.scale(s,s);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.textBaseline='middle';
  tb.querySelectorAll('th,td').forEach(td=>{const b=td.getBoundingClientRect(),st=getComputedStyle(td),X=b.left-r.left,Y=b.top-r.top;
    if(st.backgroundColor!=='rgba(0, 0, 0, 0)'&&st.backgroundColor!=='transparent'){x.fillStyle=st.backgroundColor;x.fillRect(X,Y,b.width,b.height)}
    x.fillStyle=st.color;x.font=st.fontStyle+' '+st.fontWeight+' '+st.fontSize+' '+st.fontFamily;x.textAlign=st.textAlign==='left'?'left':'center';
    const txt=td.innerText.replace(/\s+/g,' ').trim();
    const room=b.width-6,wid=x.measureText(txt).width;
    if(wid>room)x.font=st.fontStyle+' '+st.fontWeight+' '+(parseFloat(st.fontSize)*room/wid)+'px '+st.fontFamily;
    x.fillText(txt,st.textAlign==='left'?X+parseFloat(st.paddingLeft):X+b.width/2,Y+b.height/2)});
  return copyCanvas(cv,title)}
document.querySelectorAll('.tw').forEach(w=>{const tb=w.querySelector('table');
  w.parentNode.insertBefore(actions(()=>tableImage(tb,w.dataset.title),()=>navigator.clipboard.writeText(tableRows(tb).map(r=>r.join('\t')).join('\n')),'tb','Copiar tabela'),w)});
const rows={};CH.forEach(c=>{(rows[c.row]=rows[c.row]||[]).push(c)});
CH.forEach((c,idx)=>{
  const d=document.createElement('section');d.className='c'+(rows[c.row].length<2?' full':'')+(c.tall?' tall':'');
  const h=document.createElement('h2');h.textContent=c.title[0]||'';d.appendChild(h);
  if(c.title[1]){const p=document.createElement('p');p.className='sub';p.textContent=c.title[1];d.appendChild(p)}
  const e=document.createElement('div');e.className='chart';
  d.appendChild(actions(()=>chartImage(c,insts[idx]),()=>chartData(c)));
  d.appendChild(e);grid.appendChild(d);
  c._full=rows[c.row].length<2;
  const i=echarts.init(e,null,{renderer:'canvas'});i.setOption(build(c));insts.push(i)});
addEventListener('resize',()=>insts.forEach(i=>i.resize()));
const ASOF='2026-10';
async function poll(){try{
  const st=await fetch('state_revelio.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  if(st.as_of!==ASOF){location.replace(location.pathname+'?v='+st.as_of);return}
  const nx=st.next_release?new Date(st.next_release).getTime():null;
  document.getElementById('wait').hidden=!(nx&&Date.now()>nx);
}catch(e){}}
poll();setInterval(poll,20000);
